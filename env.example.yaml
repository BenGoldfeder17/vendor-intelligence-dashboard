# ═══════════════════════════════════════════════════════════════════════════════
#  env.example.yaml — TEMPLATE. Copy to env.yaml and fill in.
#
#      cp env.example.yaml env.yaml
#
#  env.yaml is the SINGLE custom-configuration file. The app reads it (via
#  scripts/preload-env.cjs) and Cloud Run deploys with it (--env-vars-file), so
#  there is no drift between configuration and deployment.
#
#  env.yaml is gitignored and blocked from agent access (.claude/settings.json).
#  THIS template file is safe, committed, and readable — keep real values out.
#
#  FORMAT: flat KEY: value only. Cloud Run rejects nested maps, so structured
#  values (vendor contracts) travel as a JSON string in a single key.
#
#  ⚠ QUOTE EVERY VALUE. YAML 1.1 turns bare y/Y/n/N/yes/no/on/off/true/false into
#    BOOLEANS, and Cloud Run rejects non-string env values with an unhelpful
#    "Found False (type <class 'bool'>)" that does not name the key. A bare
#    PO_ACCEPT_CODE: N becomes False. Every value below is quoted for this reason.
#    `npm run validate` catches it before a deploy does.
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
#  SECRETS — LEAVE THESE EMPTY
#
#  Do not write values here. Inject them as real environment variables from a
#  secret manager at deploy time; real env vars always override this file.
#
#  Why: anything with shell access — an AI coding agent included — can read any
#  file its OS user can read. Blocking the read is not a guarantee; not having
#  the secret on the machine is. See SECRETS.md.
#
#  `npm run validate` FAILS if any of these has a value.
# ═══════════════════════════════════════════════════════════════════════════════
LWA_CLIENT_ID: ""
LWA_CLIENT_SECRET: ""
LWA_REFRESH_TOKEN: ""

# ─── Identity / branding ───
APP_MARK: "AVC"
APP_NAME: "Vendor Intelligence"
ORG_NAME: "your company"
OWN_BRAND_LABEL: "Own brand"
OTHER_BRAND_LABEL: "Other brands"
# Comma-separated tokens identifying own-brand products when the CSV has no
# Brand column. Empty → everything treated as own-brand (no split).
OWN_BRAND_MATCHERS: ""
DTC_SITE_NAME: "your DTC site"
DTC_SITE_URL: ""

# ─── Marketplace API ───
SPAPI_ENDPOINT: "https://sellingpartnerapi-na.amazon.com"
SPAPI_MARKETPLACE_ID: "ATVPDKIKX0DER"
SPAPI_SELLER_ID: ""
SPAPI_DISTRIBUTOR_VIEW: "SOURCING"
SPAPI_SELLING_PROGRAM: "RETAIL"
STYLE_ATTR: "model_number"
STYLE10_ATTR: "part_number"

# ─── Sync tuning ───
SALES_LOOKBACK_DAYS: "180"
SALES_MAX_REPORTS: "26"
SALES_PERIOD: "WEEK"
PO_LOOKBACK_DAYS: "365"
FORECAST_WEEKS: "26"

# ─── Thresholds (fraction or percent both accepted) ───
NET_PPM_FLOOR: "32.75%"
MARGIN_BENCHMARK: "35%"
PO_DECAY_THRESHOLD: "-30%"
BROKEN_TAIL_FLOOR: "-100%"
AMBER_HEADROOM_PTS: "2"
CONFIRMATION_WATCH_RATE: "85%"
CONFIRMATION_ACTION_RATE: "75%"

# ─── Vendor contracts, per vendor code (JSON in one key) ───
# Terms differ per code; a single global floor mis-ranks codes whenever they do.
# Numbers may be fractions (0.30) or percents (30). Omitted fields inherit the
# CONTRACT_DEFAULT_* values below.
#   {"CODE":{"floor":30,"coopPct":8,"paymentTermsPct":2,
#            "damageAllowancePct":1,"freightPct":0,"returnsProvisionPct":0}}
# SECRET: your negotiated terms are commercially confidential. Inject this one
# too — it is arguably the most sensitive value here even though it is not a
# credential. "{}" means "none configured" and is a valid empty placeholder.
VENDOR_CONTRACTS: '{}'

CONTRACT_DEFAULT_FLOOR: "32.75%"
CONTRACT_DEFAULT_COOP_PCT: "0%"
CONTRACT_DEFAULT_PAYMENT_TERMS_PCT: "0%"
CONTRACT_DEFAULT_DAMAGE_PCT: "0%"
CONTRACT_DEFAULT_FREIGHT_PCT: "0%"
CONTRACT_DEFAULT_RETURNS_PCT: "0%"

# ─── Suppression codes (VENDOR-SPECIFIC — verify against your item master) ───
# Classes: margin | operational | not_suppressed | unknown
# A code meaning "in stock, ship it" mis-classed as suppression inflates the
# ledger by thousands of styles. Never guess a letter's meaning.
SUPPRESSION_CODES: "M:margin,P:margin,D:operational,F:operational,H:operational,I:operational,Q:operational,S:operational,V:operational,W:operational,Y:operational,N:not_suppressed"
SUPPRESSION_CODE_NAMES: "M:Margin,P:Net margin,D:Discontinued,F:MOI/Factor,H:Hazmat,I:Inventory control,Q:Quality control,S:Seasonality,V:Vendor prohibits,W:Warehouse impact,Y:Send zero inventory,N:Send inventory"
PO_ACCEPT_CODE: "N"

# ─── Storage: local | s3 | gcs ───
# On ephemeral filesystems (Cloud Run, App Runner, Lambda, Fly) 'local' loses
# all state on cold start — use s3/gcs or mount a persistent volume.
STORAGE_DRIVER: "local"
STORAGE_LOCAL_DIR: ".data"
STORAGE_BUCKET: ""
STORAGE_PREFIX: ""
S3_REGION: "us-east-1"
S3_ENDPOINT: ""
S3_FORCE_PATH_STYLE: "false"
PUBLIC_IMAGE_BUCKET: ""
PUBLIC_IMAGE_BASE_URL: ""

# ─── Warehouse (optional; margin panels work without it) ───
WAREHOUSE_ENABLED: "false"
BQ_PROJECT: ""
WAREHOUSE_SOURCE_DATASET: "vendor_feeds"
WAREHOUSE_SNAPSHOT_DATASET: "avc_risk_monitor"
WAREHOUSE_LOCATION: "US"
TABLE_PRICE_FILE: "price_file"
TABLE_INVENTORY: "inventory"
TABLE_ASIN_STYLE_MAP: "asin_style_map"
TABLE_CATALOG: "catalog_sourcing"
COL_STYLE: "Style"
COL_ASIN: "ASIN"
COL_SUPPRESSION_FLAGS: "SendZeroFlags"
COL_REPLENISHMENT_CODE: "ReplenishmentCode"
COL_QTY_ON_HAND: "QtyOnHand"
COL_QTY_ON_ORDER: "QtyOnOrder"
COL_QTY_IN_ROUTE: "QtyInRoute"

# ─── Security ─── SECRET: inject, do not write here ───
# openssl rand -hex 32
SNAPSHOT_TOKEN: ""

# ─── Deployment identity (not used at request time) ───
DEPLOY_PLATFORM: "other"
DEPLOY_SERVICE: "vendor-dashboard"
DEPLOY_REGION: ""
DEPLOY_SERVICE_URL: ""
DEPLOY_PROJECT_ID: ""
DEPLOY_PROJECT_NUMBER: ""
DEPLOY_RUNTIME_IDENTITY: ""
DEPLOY_IMAGE: ""
DEPLOY_MIN_INSTANCES: "1"
DEPLOY_MAX_INSTANCES: "1"
DEPLOY_MEMORY: "1Gi"
DEPLOY_TIMEOUT_SECONDS: "3600"
